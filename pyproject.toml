[project]
name = "prep-presisi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rimba-maker", email = "caesarbimantara00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
    "marimo>=0.23.16",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "statsforecast>=2.0.1",
    "streamlit>=1.60.0",
    "xgboost>=3.3.0",
]

[project.scripts]
prep-presisi = "prep_presisi:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
